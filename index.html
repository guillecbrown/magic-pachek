// ------------------------------------------------------- subida de nivel
// ui.subir = { id, uid, nivel, modo: 'subir' | 'pendiente', talento, mejora }
function abrirSubir(id, uid, modo) {
  const h = uid ? J.buscar(uid) : previa(HEROES.find(d => d.id === id));
  const nivel = modo === 'subir' ? h.nivel + 1 : Heroes.pendientes(h)[0];
  const sug = h.def.mejoras[nivel];
  ui.subir = { id: h.def.id, uid, nivel, modo, talento: null, mejora: sug ? Object.assign({}, h.elecciones.mejoras[nivel] || sug) : null };
  UI.render();
}

function vistaSubir() {
  const st = ui.subir;
  const def = HEROES.find(d => d.id === st.id);
  const h = st.uid ? J.buscar(st.uid) : previa(def);
  const n = st.nivel;
  // Cómo queda en el nivel nuevo, con lo elegido hasta ahora.
  const hn = { tipo: 'heroe', def, nivel: n, px: h.px, estados: {}, recursos: {}, espacios: { max: [], usados: [] }, objetos: h.objetos || [],
    elecciones: { talentos: Object.assign({}, h.elecciones.talentos, st.talento ? { [n]: st.talento } : {}), mejoras: Object.assign({}, h.elecciones.mejoras, st.mejora ? { [n]: st.mejora } : {}) } };
  Heroes.recalcular(hn, true);
  const ha = { ...hn, nivel: n - 1, elecciones: { talentos: Object.fromEntries(Object.entries(hn.elecciones.talentos).filter(([k]) => +k < n)), mejoras: hn.elecciones.mejoras } };
  Heroes.recalcular(ha, true);
  const gana = [];
  if (st.modo === 'subir') {
    gana.push(`❤ Puntos de golpe: ${ha.pvMax} → <b>${hn.pvMax}</b>`);
    if (R5.prof(n) > R5.prof(n - 1)) gana.push(`Competencia +${R5.prof(n)}`);
    def.habilidades.filter(a => a.nivel === n).forEach(a => gana.push(`<span class="tag ${a.tipo}">${TIPO_NOMBRE[a.tipo]}</span><b>${a.nombre}</b>: ${a.texto(hn)}`));
    def.rasgos.filter(r => r.nivel === n).forEach(r => gana.push(`<span class="tag pasiva">Rasgo</span><b>${r.nombre}</b>: ${r.texto}`));
    if (def.lanzador) {
      const e0 = R5.ESPACIOS[def.lanzador.tipo][n - 1] || [], e1 = R5.ESPACIOS[def.lanzador.tipo][n];
      if (e1.join() !== e0.join()) gana.push(`Espacios de conjuro: ${e1.map((m, i) => `${m} de nv ${i + 1}`).join(', ')}`);
    }
  }
  const tals = Heroes.talentosDisponibles(h, n).map(x => `<div class="talento ${x.puede ? '' : 'bloq'} ${st.talento === x.id ? 'sel' : ''}" ${x.puede ? `data-act="talento" data-k="${x.id}"` : ''}>
      <span class="ic">${x.icono}</span><b>${x.nombre}</b>${x.texto}<div class="veces">${x.requiere && !x.requiere(def) ? 'Solo lanzadores de conjuros' : `Elegido ${x.veces}/${x.max}`}</div></div>`).join('');
  let reparto = '';
  if (st.mejora) {
    const usados = Object.values(st.mejora).reduce((a, b) => a + b, 0);
    const base = Heroes.caracteristicas(def, n - 1, h.elecciones);
    reparto = `<h4>MEJORA DE CARACTERÍSTICAS · reparte 2 puntos (quedan ${2 - usados}, máximo 20)</h4>
      <div class="reparto">${R5.ATRIBUTOS.map(a => {
        const mas = st.mejora[a] || 0, val = Math.min(20, base[a] + mas);
        return `<div><b>${R5.NOMBRE_ATR[a]}</b><div class="val">${val}${mas ? ` <i>+${mas}</i>` : ''}</div><span class="nota">${signo(R5.mod(val))}</span><br>
          <button class="chico" data-act="atr" data-k="${a}" data-d="-1" ${mas ? '' : 'disabled'}>−</button>
          <button class="chico" data-act="atr" data-k="${a}" data-d="1" ${usados < 2 && base[a] + mas < 20 ? '' : 'disabled'}>+</button></div>`;
      }).join('')}</div>`;
  }
  const listo = st.talento && (!st.mejora || Object.values(st.mejora).reduce((a, b) => a + b, 0) === 2);
  return `<div class="modal subir"><div class="caja">
    <div class="cab-s"><div class="cara" style="${estiloCara(def)}">${def.arte ? '' : def.emoji}</div>
      <div><h2 style="margin:0">${def.nombre} · ${st.modo === 'subir' ? `¡Nivel ${n}!` : `Talento del nivel ${n}`}</h2>
        <div class="nota">${def.clase} (${def.subclase}) · ${def.raza}</div></div></div>
    ${gana.length ? `<h4>LO QUE GANA</h4><div class="gana">${gana.map(g => `<div>${g}</div>`).join('')}</div>` : ''}
    <h4>ELIGE UN TALENTO</h4><div class="talentos">${tals}</div>
    ${reparto}
    <div style="display:flex;gap:10px;justify-content:flex-end;align-items:center">
      <span class="nota">${listo ? '' : st.talento ? 'Reparte los 2 puntos de característica.' : 'Elige un talento.'}</span>
      <button data-act="cerrar-subir">Cancelar</button>
      <button class="primario" data-act="confirmar-subir" ${listo ? '' : 'disabled'}>Confirmar</button></div>
  </div></div>`;
}

function confirmarSubir() {
  const st = ui.subir;
  ui.subir = null;
  const elec = { talento: st.talento, mejora: st.mejora || undefined };
  if (st.uid && st.modo === 'subir') { Juego.subirNivel(st.uid, elec); return; }
  if (st.uid) { Juego.elegirPendiente(st.uid, st.nivel, elec); guardarProgreso(); return; }
  Heroes.elegir(previa(HEROES.find(d => d.id === st.id)), st.nivel, elec);
  guardarProgreso();
  UI.render();
}

      <div class="acc">${!h.muerto ? `<button class="chico" data-act="dadoGolpe" data-uid="${h.uid}" ${h.dadosGolpe.usados >= h.nivel || h.pv >= h.pvMax ? 'disabled' : ''}>Gastar dado de golpe</button>` : ''}
        ${sube ? `<button class="chico primario" data-act="subir" data-uid="${h.uid}">⬆ Subir a nivel ${h.nivel + 1}</button>` : ''}
        ${Heroes.pendientes(h).length ? `<button class="chico primario" data-act="pendiente" data-uid="${h.uid}">★ Elegir talento (nivel ${Heroes.pendientes(h)[0]})</button>` : ''}</div>
      ${chipsTalentos(h) ? `<div style="margin-top:4px">${chipsTalentos(h)}</div>` : ''}</div>`;
  }).join('');
  return `<div class="modal"><div class="caja">
    <h2>🍺 La Taberna · descanso corto</h2>
    <p>Tienen <b style="color:var(--oro)">💰 ${S.oro} de oro</b>. Se recuperan los recursos de descanso corto. Próximo combate: <b>${Juego.etapa().nombre}</b>.</p>
    ${proxima}
    <div class="descanso">${heroes}</div>
    <div class="items">${TABERNA.map(t => {
      const lista = listas[t.id];
      const sinObj = lista !== undefined && !lista;
      const agotado = t.id === 'chisme' && S.chisme;
      return `<div class="item"><b>${t.nombre}</b><p>${t.texto}</p>
        ${lista !== undefined ? `<select id="obj-${t.id}">${lista || '<option>Nadie</option>'}</select>` : ''}
        <button data-act="comprar" data-id="${t.id}" ${S.oro < t.precio || sinObj || agotado ? 'disabled' : ''}>💰 ${t.precio}</button></div>`;
    }).join('')}</div>
    <div class="registro" style="max-height:110px;margin-bottom:10px">${S.logs.slice(-5).reverse().map(l => `<div class="${l.tipo || ''}">${l.txt}</div>`).join('')}</div>
    <div style="text-align:right"><button class="primario" data-act="continuar">Siguiente combate ⚔</button></div>
  </div></div>`;
}

// -------------------------------------------------------------- eventos
document.getElementById('app').addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  // Un clic dentro de la caja de un modal no lo cierra: solo el fondo o sus botones.
  if (el.classList.contains('modal') && ev.target !== el) return;
  if (act === 'cambiarj') {
    ev.stopPropagation();
    const ciclo = [...Array(sel.nJug).keys()].map(i => i + 1).concat(['ia']);
    sel.jugador[el.dataset.id] = ciclo[(ciclo.indexOf(sel.jugador[el.dataset.id]) + 1) % ciclo.length];
    UI.render(); return;
  }
  if (act === 'ficha') { ev.stopPropagation(); ui.ficha = el.dataset.id; UI.render(); return; }
  if (act === 'cerrar-ficha') { ui.ficha = null; UI.render(); return; }
  if (act === 'elegir') {
    const id = el.dataset.id, i = sel.ids.indexOf(id);
    if (i >= 0) { sel.ids.splice(i, 1); delete sel.jugador[id]; }
    else if (sel.ids.length < 4) { sel.ids.push(id); sel.jugador[id] = (sel.ids.length - 1) % sel.nJug + 1; }
    UI.render(); return;
  }
  if (act === 'njug') { sel.nJug = +el.dataset.k; sel.ids.forEach((id, i) => sel.jugador[id] = i % sel.nJug + 1); UI.render(); return; }
  if (['dif', 'exp', 'largo', 'mod'].includes(act)) { sel[act] = el.dataset.k; UI.render(); return; }
  if (act === 'reiniciar') {
    if (confirm('¿Volver a todos los héroes al nivel 1 y vaciar el oro del grupo?')) { Progreso.personajes = {}; Progreso.oro = 0; guardarProgreso(); UI.render(); }
    return;
  }
  if (act === 'comenzar') {
    Juego.iniciar(sel.ids.map(id => ({ id, jugador: sel.jugador[id] })), { expedicion: sel.exp, largo: sel.largo, dificultad: sel.dif, modificador: sel.mod });
    return;
  }
  if (act === 'reglas') { ui.reglas = true; UI.render(); return; }
  if (act === 'cerrar-reglas') { ui.reglas = false; UI.render(); return; }
  if (act === 'bestiario') { ui.bestiario = { filtro: 'Todos', q: '' }; UI.render(); return; }
  if (act === 'cerrar-bestiario') { ui.bestiario = null; UI.render(); return; }
  if (act === 'bfiltro') { ui.bestiario.filtro = el.dataset.k; UI.render(); return; }
  if (act === 'rapido') { ui.rapido = !ui.rapido; UI.render(); return; }
  if (act === 'registro') { ui.registro = !ui.registro; UI.render(); return; }
  if (act === 'pantalla') { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {}); return; }
  if (act === 'auto') { ui.auto = !ui.auto; UI.render(); return; }
  if (act === 'responder') { const p = ui.pregunta; ui.pregunta = null; p.res(el.dataset.k === 'si'); UI.render(); return; }
  if (act === 'terminar') { ui.pend = null; ui.caminar = null; Juego.terminarTurno(); return; }
  if (act === 'cancelar') { ev.preventDefault(); ui.pend = null; ui.caminar = null; UI.render(); return; }
  if (act === 'cerrar-ver') { ui.ver = null; ui.info = null; UI.render(); return; }
  if (act === 'otra') { S.fase = 'inicio'; UI.render(); return; }
  if (act === 'taberna') { Juego.irTaberna(); return; }
  if (act === 'continuar') { Juego.continuar(); return; }
  if (act === 'dadoGolpe') { Juego.gastarDadoGolpe(el.dataset.uid); return; }
  if (act === 'subir') { abrirSubir(null, el.dataset.uid, 'subir'); return; }
  if (act === 'pendiente') { ev.stopPropagation(); abrirSubir(el.dataset.id, el.dataset.uid, 'pendiente'); return; }
  if (act === 'talento') { ui.subir.talento = el.dataset.k; UI.render(); return; }
  if (act === 'atr') { const m = ui.subir.mejora, k = el.dataset.k; m[k] = (m[k] || 0) + +el.dataset.d; if (!m[k]) delete m[k]; UI.render(); return; }
  if (act === 'cerrar-subir') { ui.subir = null; UI.render(); return; }
  if (act === 'confirmar-subir') { confirmarSubir(); return; }
  if (act === 'comprar') { const s = document.getElementById('obj-' + el.dataset.id); Juego.comprar(el.dataset.id, s && s.value); return; }

  const h = J.buscar(S.actual);
  if (act === 'caminar') { const hh = heroeActivo(); ui.pend = null; ui.caminar = hh && ui.caminar !== hh.uid ? hh.uid : null; UI.render(); return; }
  if (act === 'hab' && h && h.tipo === 'heroe') {
    ui.caminar = null;
    const a = Heroes.habilidades(h).find(x => x.id === el.dataset.id);
    if (!a || Juego.bloqueo(h, a)) return;
    if (Heroes.necesitaObjetivo(a)) {
      const validos = (a.objetivo === 'enemigo' ? J.enemigosVivos() : S.grupo.concat(S.familiares)).filter(t => Heroes.objetivoValido(J, h, a, t));
      if (!validos.length) { J.log(`No hay ${a.objetivo === 'enemigo' ? 'enemigos' : 'aliados'} a ${Heroes.alcance(h, a)} pies (y a la vista) para ${a.nombre}.`, 'fallo'); ui.pend = null; UI.render(); return; }
      ui.pend = ui.pend && ui.pend.id === a.id ? null : { huid: h.uid, id: a.id }; UI.render(); return;
    }
    if (a.objetivo === 'area' || a.objetivo === 'celda') { ui.pend = ui.pend && ui.pend.id === a.id ? null : { huid: h.uid, id: a.id }; UI.render(); return; }
    if ((a.objetivo === 'enemigos' || a.objetivo === 'aliados') && !Heroes.grupoObjetivo(h, a).length) {
      J.log(`No hay ${a.objetivo === 'enemigos' ? 'enemigos' : 'aliados'} a ${Heroes.alcance(h, a)} pies para ${a.nombre}.`, 'fallo'); UI.render(); return;
    }
    ui.pend = null;
    Juego.usar(h.uid, a.id);
    return;
  }
  // Clic en una ficha o en una fila de la lista.
  if (act === 'unidad') {
    const u = J.buscar(el.dataset.uid || el.dataset.uidL);
    const a = cartaPendiente();
    if (a && a.objetivo === 'area' && u && u.x !== undefined) { usarEnCasilla(a, u.x, u.y); return; }
    if (ui.pend && esObjetivo(u)) { const p = ui.pend; ui.pend = null; UI.render(); Juego.usar(p.huid, p.id, u.uid); return; }
    if (!ui.pend && u) { ui.info = ui.ver = u.uid; UI.render(); }
    return;
  }
  // Clic en una casilla vacía del tablero.
  if (act === 'mapa') {
    const tab = el.getBoundingClientRect(), c = ui.cel;
    const x = Math.floor((ev.clientX - tab.left) / c), y = Math.floor((ev.clientY - tab.top) / c);
    const a = cartaPendiente(), hh = heroeActivo();
    if (!hh) return;
    if (a && (a.objetivo === 'area' || a.objetivo === 'celda')) { usarEnCasilla(a, x, y); return; }
    if (!a && ui.caminar === hh.uid) {
      const v = T.alcanzables(hh).get(`${x},${y}`);
      if (!v || v.paso || (x === hh.x && y === hh.y)) return;
      ui.caminar = null;
      Juego.mover(hh.uid, x, y);
    }
  }
});
function usarEnCasilla(a, x, y) {
  const h = heroeActivo();
  if (!h) return;
  const celda = { x, y };
  if (a.objetivo === 'area' && a.area.forma !== 'aura' && !Heroes.puntoValido(h, a, celda)) return;
  if (a.objetivo === 'celda' && !Heroes.celdaValida(h, a, celda)) return;
  ui.pend = null;
  UI.render();
  Juego.usar(h.uid, a.id, null, celda);
}
document.addEventListener('mouseover', e => {
  const el = e.target.closest && e.target.closest('.slot,[data-tip],.ficha-t,.ini,.pj,.barra-retrato');
  if (!el) { if (ui.tipEl) ocultarTip(); return; }
  if (el !== ui.tipEl) mostrarTip(el);
});
document.addEventListener('mousemove', e => {
  if (!(e.target.closest && e.target.closest('#tablero'))) return;
  if (ui.pend) pintarArea(e); else if (ui.caminar) pintarRuta(e);
});
window.addEventListener('resize', () => { if (S.fase !== 'inicio') UI.render(); });
// Ctrl + rueda: zoom del tablero (en lugar del zoom del navegador).
window.addEventListener('wheel', e => {
  if (!e.ctrlKey || S.fase === 'inicio' || !document.getElementById('escena')) return;
  e.preventDefault();
  const antes = ui.zoom;
  ui.zoom = Math.max(0.3, Math.min(1.6, ui.zoom * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  if (ui.zoom !== antes) { UI.render(); Camara.centrar(J.buscar(S.actual), false); }
}, { passive: false });
document.addEventListener('keydown', e => {
  if ((e.key === ' ' || e.key === 'Enter') && ui.lanzar) { e.preventDefault(); ui.lanzar(); return; }
  const flecha = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[e.key];
  const esc = document.getElementById('escena');
  if (flecha && esc && !e.target.closest('input,select')) { e.preventDefault(); esc.scrollBy({ left: flecha[0] * 160, top: flecha[1] * 160, behavior: 'smooth' }); return; }
  if (e.key !== 'Escape') return;
  if (ui.ver) { ui.ver = ui.info = null; UI.render(); } else if (ui.pend || ui.caminar) { ui.pend = ui.caminar = null; UI.render(); }
});
// La búsqueda del bestiario solo redibuja la lista, para no perder el foco.
document.addEventListener('input', e => {
  if (e.target.id !== 'bbusca') return;
  ui.bestiario.q = e.target.value;
  document.getElementById('blista').innerHTML = listaBestiario();
});

UI.render();
// En la versión publicada no va el arte del Manual de Monstruos: si no está, cada monstruo usa su emoji.
(() => {
  const m = Object.values(MONSTRUOS).find(m => m.arte);
  if (!m) return;
  const prueba = new Image();
  prueba.onerror = () => { Object.values(MONSTRUOS).forEach(m => delete m.arte); UI.render(); };
  prueba.src = m.arte;
})();
</script>
